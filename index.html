<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="AllContent">
      <p class="main-text">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Omnis corporis
        eius nobis! <br />
        Possimus <i> mollitia </i> dignissimos veniam?
      </p>

      <p class="second-text">You <i>know</i> you want to</p>
      <form class="signup-form" action="example.com/path" method="post">
        <div class="field">
          <label for="first_name">FIRST NAME</label>
          <input type="text" id="first_name" name="first_name" />
        </div>

        <div class="field">
          <label for="last_name">LAST NAME</label>
          <input type="text" id="last_name" name="last_name" />
        </div>

        <div class="field">
          <label for="email">EMAIL</label>
          <input type="text" id="email" name="email" />
        </div>

        <div class="field">
          <label for="phone_number">PHONE NUMBER</label>
          <input type="text" id="phone_number" name="phone_number" />
        </div>

        <div class="field">
          <label for="user_password">PASSWORD</label>
          <input type="password" id="user_password" name="password" />
        </div>

        <div class="field">
          <label for="confirm_password">CONFIRM PASSWORD</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
          />
        </div>
      </form>
      <br />
      <button class="btn">Create Account</button>

      <p class="logIn">Already have an account? <a href="url">Log in</a></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
